# Production Docker Compose
# Usage: docker compose -f deployments/docker/docker-compose.yml up -d
# Requires: .env file with production values (see .env.example)
# Optional: Docker Secrets files in ./secrets/ directory

name: modular-monolith-prod

services:
  app:
    image: ${APP_IMAGE:-modular-monolith-app:latest}
    restart: always
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL}
      SESSION_SECRET_FILE: /run/secrets/session_secret
      CORS_ORIGIN: ${CORS_ORIGIN}
      DODO_API_KEY_FILE: /run/secrets/dodo_api_key
      DODO_WEBHOOK_SECRET_FILE: /run/secrets/dodo_webhook_secret
      DODO_BASE_URL: ${DODO_BASE_URL}
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-modular-monolith}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_INSECURE: "false"
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    secrets:
      - session_secret
      - dodo_api_key
      - dodo_webhook_secret
      - metrics_token
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${SERVER_PORT:-8080}/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    labels:
      traefik.enable: "true"
      traefik.http.services.app.loadbalancer.server.port: "${SERVER_PORT:-8080}"
      traefik.http.routers.app.rule: Host(`${DOMAIN}`)
      traefik.http.routers.app.entrypoints: websecure
      traefik.http.routers.app.tls: "true"
      traefik.http.routers.app.tls.certresolver: letsencrypt
      traefik.http.routers.app.middlewares: security-headers@docker,compress@docker
      traefik.http.middlewares.security-headers.headers.stsSeconds: "63072000"
      traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.security-headers.headers.stsPreload: "true"
      traefik.http.middlewares.security-headers.headers.forceSTSHeader: "true"
      traefik.http.middlewares.security-headers.headers.frameDeny: "true"
      traefik.http.middlewares.security-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.security-headers.headers.browserXssFilter: "true"
      traefik.http.middlewares.security-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.security-headers.headers.permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
      traefik.http.middlewares.security-headers.headers.contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'"
      traefik.http.middlewares.compress.compress: "true"
      traefik.http.middlewares.compress.compress.excludedContentTypes: application/grpc

  postgres:
    image: postgres:17.5-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"

  traefik:
    image: traefik:v3.4.0
    restart: always
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt-staging.acme.email=${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - letsencrypt_data:/letsencrypt
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.05"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls: "true"
      traefik.http.routers.dashboard.tls.certresolver: letsencrypt
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: dashboard-auth@docker
      traefik.http.middlewares.dashboard-auth.basicauth.users: ${TRAEFIK_DASHBOARD_USERS}

secrets:
  session_secret:
    file: ./secrets/session_secret
  dodo_api_key:
    file: ./secrets/dodo_api_key
  dodo_webhook_secret:
    file: ./secrets/dodo_webhook_secret
  metrics_token:
    file: ./secrets/metrics_token
  postgres_password:
    file: ./secrets/postgres_password

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  letsencrypt_data:
