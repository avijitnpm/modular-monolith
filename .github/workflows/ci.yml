name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "Unformatted files:"; echo "$diff"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -short -count=1 -race

      - name: Build
        run: go build -trimpath -ldflags="-s -w" ./cmd/server

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Type check
        run: pnpm check
        working-directory: frontend

      - name: Lint
        run: pnpm lint
        working-directory: frontend

      - name: Build
        run: pnpm build
        working-directory: frontend

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose
        run: docker compose config --quiet

      - name: Build image
        run: docker compose build app
