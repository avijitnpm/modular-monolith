name: modular-monolith

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: modular-monolith-app:local
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-modular-monolith}
      APP_ENV: ${APP_ENV:-development}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}?sslmode=disable
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-modular-monolith}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-modular-monolith}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-https://${DOMAIN:-localhost}/api/v1/auth/callback}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-at-least-32-random-characters}
      DEV_TOKEN_SECRET: ${DEV_TOKEN_SECRET:-dev-signing-key-for-local-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${DOMAIN:-localhost}}
      DODO_API_KEY: ${DODO_API_KEY:-dev_key}
      DODO_WEBHOOK_SECRET: ${DODO_WEBHOOK_SECRET:-dev_secret}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-modular-monolith}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default/v1/traces
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-Authorization=Basic YWRtaW5AZXhhbXBsZS5jb206U3Ryb25nUGFzc3dvcmQxMjM=}
    depends_on:
      postgres:
        condition: service_healthy
      openobserve:
        condition: service_started
    networks:
      - monolith_internal
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${SERVER_PORT:-8080}/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # --- Service ---
      traefik.enable: "true"
      traefik.http.services.app.loadbalancer.server.port: "${SERVER_PORT:-8080}"

      # --- HTTPS Router (single catchall) ---
      traefik.http.routers.app.rule: Host(`${DOMAIN:-localhost}`)
      traefik.http.routers.app.entrypoints: websecure
      traefik.http.routers.app.tls: "true"
      traefik.http.routers.app.tls.certresolver: ${CERT_RESOLVER:-}
      traefik.http.routers.app.middlewares: security-headers@docker,compress@docker

      # --- Security Headers Middleware ---
      traefik.http.middlewares.security-headers.headers.stsSeconds: "63072000"
      traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.security-headers.headers.stsPreload: "true"
      traefik.http.middlewares.security-headers.headers.forceSTSHeader: "true"
      traefik.http.middlewares.security-headers.headers.frameDeny: "true"
      traefik.http.middlewares.security-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.security-headers.headers.browserXssFilter: "true"
      traefik.http.middlewares.security-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.security-headers.headers.permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
      traefik.http.middlewares.security-headers.headers.contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'"
      traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-Robots-Tag: noindex,nofollow

      # --- Compression Middleware ---
      traefik.http.middlewares.compress.compress: "true"
      traefik.http.middlewares.compress.compress.excludedContentTypes: application/grpc

  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monolith_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  openobserve:
    image: openobserve/openobserve:v0.14.5
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-admin@example.com}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-StrongPassword123}
      ZO_DATA_DIR: /data
    ports:
      - "127.0.0.1:${OPENOBSERVE_PORT:-5080}:5080"
    volumes:
      - openobserve_data:/data
    networks:
      - monolith_internal
    # No healthcheck: openobserve/openobserve is a distroless image without
    # /bin/sh, wget, or curl. CMD-SHELL cannot execute. The app's OTEL exporter
    # is asynchronous and handles unavailability gracefully.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    image: traefik:v3.4.0
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt-staging.acme.email=${ACME_EMAIL:-admin@example.com}
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deployments/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - letsencrypt_data:/letsencrypt
    depends_on:
      app:
        condition: service_healthy
    networks:
      - monolith_internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.05"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # --- Dashboard: BasicAuth protected, localhost only ---
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN:-localhost}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls: "true"
      traefik.http.routers.dashboard.tls.certresolver: ${CERT_RESOLVER:-}
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: dashboard-auth@docker
      # Default: admin/admin — MUST be changed in production
      # Generate with: htpasswd -nB admin
      traefik.http.middlewares.dashboard-auth.basicauth.users: ${TRAEFIK_DASHBOARD_USERS:-admin:$$2y$$05$$ZGRiYjM4NjA1OWI1MjZlNe.sFCWGEHASxgGY8H3.EeGlqMmg7WDWK}

networks:
  monolith_internal:
    driver: bridge

volumes:
  postgres_data:
  openobserve_data:
  letsencrypt_data:
